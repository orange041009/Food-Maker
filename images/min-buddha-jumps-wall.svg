<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="0"/>
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="350" cy="250" r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="200" cy="150" r="120" fill="rgba(255,255,255,0.04)"/>
  <!-- Emoji -->
  <text x="200" y="115" text-anchor="middle" font-size="60" filter="url(#shadow)">🍲</text>
  <!-- Dish name -->
  <text x="200" y="175" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="bold" fill="white" filter="url(#shadow)">佛跳墙</text>
  <!-- Cuisine badge -->
  <rect x="140" y="200" width="120" height="32" rx="16" fill="rgba(255,255,255,0.2)"/>
  <text x="200" y="222" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="rgba(255,255,255,0.9)">闽菜</text>
  <!-- Decorative dots -->
  <circle cx="160" cy="260" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="200" cy="260" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="240" cy="260" r="3" fill="rgba(255,255,255,0.3)"/>
</svg>